name: Secrets CI Workflow

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Secrets Test
              run: |
                echo "Testing secrets..."
                echo "Secret 1: ${{ secrets.MY_SECRET }}"
                echo "Now testing secret as environment variable..."
                echo "Secret 1: $MY_SECRET"
              env:
                MY_SECRET: ${{ secrets.MY_SECRET }}